[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lecsim"
dynamic = ["version"]
description = "Agent-based simulation of lecturer careers in an Indonesian university department"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "numpy>=1.26",
    "polars>=1.0",
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "snakemake>=8"]

[project.scripts]
lecsim = "lecsim.cli:app"

[tool.hatch.version]
path = "src/lecsim/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/lecsim", "analysis"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
