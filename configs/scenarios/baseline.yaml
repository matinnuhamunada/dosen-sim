# Baseline M1 scenario: a small department of random agents.
name: baseline
regulation: ../regulations/national.yaml # relative to this file
semesters: 10

lecturers:
  - { count: 5, policy: random, rank: Asisten Ahli, degree: master }

# Environment / production parameters are model assumptions, not regulation.
# All PLACEHOLDERS — see docs/assumptions.md.
environment:
  production: # output = scale * hours_per_semester^alpha * lognormal(mean 1, sigma)
    research: { scale: 0.05, alpha: 0.7, sigma: 0.3 } # TODO(source): manuscripts per semester
    community_service: { scale: 0.05, alpha: 0.7, sigma: 0.3 } # TODO(source): outputs per semester
  journals: # acceptance probability and decision lag (semesters) per tier
    national: { accept_prob: 0.7, lag_semesters: 1 } # TODO(source)
    national_accredited: { accept_prob: 0.5, lag_semesters: 1 } # TODO(source)
    international: { accept_prob: 0.3, lag_semesters: 2 } # TODO(source)
    international_reputable: { accept_prob: 0.15, lag_semesters: 2 } # TODO(source)
  grants:
    base_prob: 0.1 # TODO(source)
    prob_per_publication: 0.02 # TODO(source): track-record effect
    max_prob: 0.5 # TODO(source)
    duration_semesters: 4 # TODO(source)
    research_multiplier: 1.5 # TODO(source): research productivity while a grant is active
