    - { name: dean, hours_per_week: 20, duration_semesters: 10, allowance_monthly: 10000000, min_rank: Lektor Kepala } # TODO(source)
    - { name: vice_dean_academic, hours_per_week: 16, duration_semesters: 10, allowance_monthly: 7500000, min_rank: Lektor } # TODO(source)
