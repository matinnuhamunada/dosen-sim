# Case: an anonymised Indonesian faculty (PTNBH university). Headcount from its public staff
# directory (accessed 2026-10-09; source withheld for anonymity): 68 lecturers in 12
# laboratories, 16 of them Profesor, about 53 with a doctorate. The non-professor split below
# is a PLACEHOLDER (TODO(source)). Lecturers are masked: IDs are L01_<common Indonesian name>,
# pseudonyms only, not the real staff.
name: faculty_case
include: [../department.yaml]
regulation: ../regulations/ptnbh.yaml
agents: ../agents/archetypes.yaml
semesters: 40

# Newer national rules, applied here only (the M4 scenarios keep the older ones):
regulation_overrides:
  recruitment: # Permendiktisaintek 52/2025 (via juknis Kepmendiktisaintek 39/M/KEP/2026)
    min_degree: doctorate # user-stated: new lecturers need a doctorate
    entry_rank: Lektor # doctorate holders are appointed straight to Lektor
  probation: # first year of a new hire
    semesters: 2 # PP 11/2017: one-year CPNS probation
    salary_factor: 0.8 # PP 7/1977 art. 5(1), Perka BKN 1/2024 art. 10: CPNS get 80 % of base salary
    teaching_credit_factor: 0.5 # user-stated: half credit for the same hours. TODO(source)
    barred_activities: [supervision] # user-stated: probationers may not supervise. TODO(source)
    mentor_ranks: [Lektor Kepala, Profesor] # user-stated: co-teach with senior members. TODO(source)

# Ages: everyone (founders and hires) starts their career at 29-31 (user-stated estimate);
# founders' years of service are drawn by rank. TODO(source): real service-year ranges.
demography:
  start_age: [29, 31]
  initial_service_years:
    Asisten Ahli: [0, 6]
    Lektor: [2, 16]
    Lektor Kepala: [8, 30]
    Profesor: [15, 38]

department:
  hiring:
    lag_semesters: 2 # TODO(source): retirements and leavers are replaced after this lag
    probation_coverage: 0.5 # assumption: a co-taught hour covers half a class-hour of demand
  max_roles_per_lecturer: 1 # assumption: one structural position each
  # Structural positions: 5-year terms (user-stated). Minimum ranks are user-stated; hours, terms and allowances are
  # PLACEHOLDERS (TODO(source)). Programme heads' minimum rank is assumed (not stated).
