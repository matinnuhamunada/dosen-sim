# Case: an anonymised Indonesian faculty (PTNBH university). Headcount from its public staff
# directory (accessed 2026-10-09; source withheld for anonymity): 68 lecturers in 12
# laboratories, 16 of them Profesor, about 53 with a doctorate. The non-professor split below
# is a PLACEHOLDER (TODO(source)). Lecturers are masked: IDs are L01_<common Indonesian name>,
# pseudonyms only, not the real staff.
name: faculty_case
include: [../department.yaml]
regulation: ../regulations/ptnbh.yaml
agents: ../agents/archetypes.yaml
semesters: 40

# Newer national rules, applied here only (the M4 scenarios keep the older ones):
regulation_overrides:
  recruitment: # Permendiktisaintek 52/2025 (via juknis Kepmendiktisaintek 39/M/KEP/2026)
    min_degree: doctorate # user-stated: new lecturers need a doctorate
    entry_rank: Lektor # doctorate holders are appointed straight to Lektor
  # Workload in SKS (user-stated): 16 SKS = 40 h/week, so 1 SKS = 2.5 h/week. 16 SKS is the
  # paid norm, not a cap: duty above it is unpaid overtime (and strains, see burnout below).
  # The bonus needs >= 12 SKS of teaching + supervision + research and at least one community
  # service (read as >= 1 SKS); roles and committees count as supporting SKS. Dean and vice
  # deans are exempt (bkd_exempt on the role).
  time:
    hours_per_week: 56 # assumption: weekly time budget = 40 h norm + room for overtime/rest
  workload:
    max_duty_hours_per_week: 56 # no hard cap beyond the time budget (overload is possible)
  bkd:
    hours_per_sks: 2.5 # user-stated: 16 SKS = 40 h/week
    max_sks: 16 # user-stated: paid norm; above it is unpaid overtime
    bonus_requires:
      - { categories: [education, research], min_sks: 12 } # user-stated
      - { categories: [community_service], min_sks: 1 } # user-stated "one community service"; 1 SKS assumed
  credit_table:
    patent_filed: { category: research, points_per_unit: 40.0 } # TODO(source): KUM for a granted patent; shared by inventors
  pay:
    remuneration:
      per_credit_point: 0 # replaced by the fixed BKD bonus below
      bkd_bonus_by_rank: # user-stated: 10-20 M IDR; per semester assumed
        Asisten Ahli: 10000000
        Lektor: 20000000
        Lektor Kepala: 20000000
        Profesor: 20000000
  probation: # first year of a new hire
    semesters: 2 # PP 11/2017: one-year CPNS probation
    salary_factor: 0.8 # PP 7/1977 art. 5(1), Perka BKN 1/2024 art. 10: CPNS get 80 % of base salary
    teaching_credit_factor: 0.5 # user-stated: half credit for the same hours. TODO(source)
    barred_activities: [supervision] # user-stated: probationers may not supervise. TODO(source)
    mentor_ranks: [Lektor Kepala, Profesor] # user-stated: co-teach with senior members. TODO(source)

# Ages: everyone (founders and hires) starts their career at 29-31 (user-stated estimate);
# founders' years of service are drawn by rank. TODO(source): real service-year ranges.
demography:
  start_age: [29, 31]
  initial_service_years:
    Asisten Ahli: [0, 6]
    Lektor: [2, 16]
    Lektor Kepala: [8, 30]
    Profesor: [15, 38]

environment:
  burnout:
    sustainable_hours: 40 # 16 SKS norm: only work beyond it (overtime) strains
  # Research resources by rank (students, lab, network); grants x1.5 on top. Calibrated so an
  # early-career lecturer publishes ~1 paper a semester and a professor 4-8 (user-stated).
  research_productivity_by_rank: { Asisten Ahli: 0.7, Lektor: 0.9, Lektor Kepala: 1.2, Profesor: 1.7 }
  # Patents from lab research (PLACEHOLDERS, TODO(source)). Calibration targets: under 5 % of
  # Indonesian patents are ever commercialised (DJKI, via news reports) vs 30-40 % in
  # developed countries; ~30 % of top-US-university patents were licensed (2002-2010
  # study); higher TRL at transfer raises commercial success; TRL 3-6 is the "valley of
  # death". Grants raise research output, so they speed up papers and TRL alike.
  patents:
    trl_rate: 0.04 # median lab: TRL 1 -> 4 (filing) in ~5 years; TRL 9 rarely within 20 years
    filing_trl: 4
    license_prob_by_trl: { 4: 0.001, 5: 0.002, 6: 0.004, 7: 0.008, 8: 0.012, 9: 0.02 } # per semester; ~10 % of filed patents licensed within 20 years (between the Indonesian <5 % and the US ~30 %)
    royalty_per_semester: 43000000 # ~430 M IDR per commercialised patent over 10 semesters (top national university: 35 patents, 15 bn IDR royalty)
    inventor_share: 0.4 # TODO(source): PMK 136/2021 inventor reward tariff / university IP policy
    royalty_semesters: 10

department:
  hiring:
    lag_semesters: 2 # TODO(source): retirements and leavers are replaced after this lag
    probation_coverage: 0.5 # assumption: a co-taught hour covers half a class-hour of demand
  max_roles_per_lecturer: 1 # assumption: one structural position each
  # Structural positions (supporting SKS): 5-year terms and minimum ranks are user-stated;
  # programme heads' minimum rank is assumed. Leadership perks (user-stated: better access to
  # grants and networks): grant_prob_bonus adds to the grant success chance, network_boost
  # multiplies research output; values are PLACEHOLDERS (TODO(source)). Hours (SKS x 2.5: dean 8, vice deans 6, head of
  # department 3, programme heads 2, lab heads 1) and allowances are PLACEHOLDERS (TODO(source)).
  roles:
    - { name: dean, hours_per_week: 20, duration_semesters: 10, allowance_monthly: 10000000, min_rank: Lektor Kepala, bkd_exempt: true, grant_prob_bonus: 0.15, network_boost: 0.3 } # TODO(source)
    - { name: vice_dean_academic, hours_per_week: 15, duration_semesters: 10, allowance_monthly: 7500000, min_rank: Lektor, bkd_exempt: true, reports_to: dean, grant_prob_bonus: 0.1, network_boost: 0.2 } # TODO(source)
    - { name: vice_dean_finance, hours_per_week: 15, duration_semesters: 10, allowance_monthly: 7500000, min_rank: Lektor, bkd_exempt: true, reports_to: dean, grant_prob_bonus: 0.1, network_boost: 0.2 } # TODO(source)
    - { name: vice_dean_collaboration, hours_per_week: 15, duration_semesters: 10, allowance_monthly: 7500000, min_rank: Lektor, bkd_exempt: true, reports_to: dean, grant_prob_bonus: 0.1, network_boost: 0.2 } # TODO(source)
    - { name: head_of_department, hours_per_week: 7.5, duration_semesters: 10, allowance_monthly: 4000000, min_rank: Lektor, reports_to: vice_dean_academic, grant_prob_bonus: 0.1, network_boost: 0.15 } # TODO(source)
    - { name: head_of_program_undergraduate, hours_per_week: 5, duration_semesters: 10, allowance_monthly: 3000000, min_rank: Lektor, reports_to: head_of_department, grant_prob_bonus: 0.05, network_boost: 0.1 } # TODO(source)
    - { name: head_of_program_master, hours_per_week: 5, duration_semesters: 10, allowance_monthly: 3000000, min_rank: Lektor, reports_to: head_of_department, grant_prob_bonus: 0.05, network_boost: 0.1 } # TODO(source)
    - { name: head_of_program_doctoral, hours_per_week: 5, duration_semesters: 10, allowance_monthly: 3000000, min_rank: Lektor, reports_to: head_of_department, grant_prob_bonus: 0.05, network_boost: 0.1 } # TODO(source)
    - { name: lab_head_01, hours_per_week: 2.5, duration_semesters: 10, allowance_monthly: 1000000, min_rank: Lektor, lab: LAB-01, reports_to: head_of_department, grant_prob_bonus: 0.05, network_boost: 0.1 } # TODO(source)
    - { name: lab_head_02, hours_per_week: 2.5, duration_semesters: 10, allowance_monthly: 1000000, min_rank: Lektor, lab: LAB-02, reports_to: head_of_department, grant_prob_bonus: 0.05, network_boost: 0.1 } # TODO(source)
    - { name: lab_head_03, hours_per_week: 2.5, duration_semesters: 10, allowance_monthly: 1000000, min_rank: Lektor, lab: LAB-03, reports_to: head_of_department, grant_prob_bonus: 0.05, network_boost: 0.1 } # TODO(source)
    - { name: lab_head_04, hours_per_week: 2.5, duration_semesters: 10, allowance_monthly: 1000000, min_rank: Lektor, lab: LAB-04, reports_to: head_of_department, grant_prob_bonus: 0.05, network_boost: 0.1 } # TODO(source)
    - { name: lab_head_05, hours_per_week: 2.5, duration_semesters: 10, allowance_monthly: 1000000, min_rank: Lektor, lab: LAB-05, reports_to: head_of_department, grant_prob_bonus: 0.05, network_boost: 0.1 } # TODO(source)
    - { name: lab_head_06, hours_per_week: 2.5, duration_semesters: 10, allowance_monthly: 1000000, min_rank: Lektor, lab: LAB-06, reports_to: head_of_department, grant_prob_bonus: 0.05, network_boost: 0.1 } # TODO(source)
    - { name: lab_head_07, hours_per_week: 2.5, duration_semesters: 10, allowance_monthly: 1000000, min_rank: Lektor, lab: LAB-07, reports_to: head_of_department, grant_prob_bonus: 0.05, network_boost: 0.1 } # TODO(source)
    - { name: lab_head_08, hours_per_week: 2.5, duration_semesters: 10, allowance_monthly: 1000000, min_rank: Lektor, lab: LAB-08, reports_to: head_of_department, grant_prob_bonus: 0.05, network_boost: 0.1 } # TODO(source)
    - { name: lab_head_09, hours_per_week: 2.5, duration_semesters: 10, allowance_monthly: 1000000, min_rank: Lektor, lab: LAB-09, reports_to: head_of_department, grant_prob_bonus: 0.05, network_boost: 0.1 } # TODO(source)
    - { name: lab_head_10, hours_per_week: 2.5, duration_semesters: 10, allowance_monthly: 1000000, min_rank: Lektor, lab: LAB-10, reports_to: head_of_department, grant_prob_bonus: 0.05, network_boost: 0.1 } # TODO(source)
    - { name: lab_head_11, hours_per_week: 2.5, duration_semesters: 10, allowance_monthly: 1000000, min_rank: Lektor, lab: LAB-11, reports_to: head_of_department, grant_prob_bonus: 0.05, network_boost: 0.1 } # TODO(source)
    - { name: lab_head_12, hours_per_week: 2.5, duration_semesters: 10, allowance_monthly: 1000000, min_rank: Lektor, lab: LAB-12, reports_to: head_of_department, grant_prob_bonus: 0.05, network_boost: 0.1 } # TODO(source)

  # Supporting (non-tridharma) work: event and task teams beyond the structural positions.
  # Hours count as admin (support), the honorarium is paid monthly while serving, and seats go
  # to the most junior staff first (lowest rank, then youngest; user-stated practice).
  # Every number is a PLACEHOLDER (TODO(source)); hours are 1 SKS (accreditation 2 SKS).
  max_committees_per_lecturer: 2 # TODO(source)
  committees:
    - { name: accreditation_team, hours_per_week: 5, duration_semesters: 2, members: 6, honorarium_monthly: 500000, every_semesters: 10, assigned_by: vice_dean_academic } # TODO(source): 5-year accreditation cycle assumed
    - { name: dies_natalis_committee, hours_per_week: 2.5, duration_semesters: 1, members: 6, honorarium_monthly: 300000, every_semesters: 2, offset: 1, assigned_by: vice_dean_finance } # TODO(source)
    - { name: summer_course_team, hours_per_week: 2.5, duration_semesters: 1, members: 4, honorarium_monthly: 500000, every_semesters: 2, offset: 1, assigned_by: vice_dean_collaboration } # TODO(source)
    - { name: international_seminar_committee, hours_per_week: 2.5, duration_semesters: 1, members: 6, honorarium_monthly: 300000, every_semesters: 2, assigned_by: vice_dean_collaboration } # TODO(source)
    - { name: event_committee, hours_per_week: 2.5, duration_semesters: 1, members: 4, honorarium_monthly: 200000, every_semesters: 1, assigned_by: vice_dean_finance } # TODO(source): other ad-hoc events

  # 12 laboratories (sourced count), masked as LAB-01 ... LAB-12; membership is drawn at random, hires take the leaver's lab.
  labs: [LAB-01, LAB-02, LAB-03, LAB-04, LAB-05, LAB-06, LAB-07, LAB-08, LAB-09, LAB-10, LAB-11, LAB-12]

  # Power dynamics (user-described; every weight is a PLACEHOLDER, TODO(source)).
  # Each lecturer belongs to a lab and reports up a chain: lecturer -> lab head -> head of
  # department -> vice dean (academic) -> dean. Supervisors grade every semester on merit,
  # liking, lab loyalty and standing; the grade sets the share of the semester's credit that
  # counts for the career ladder. Vice deans assign committees (junior first, favourites
  # first within a rank); serving willingly raises standing and liking, reluctantly lowers
  # liking. Consulting lowers standing. Appointments weigh seniority, standing, the
  # appointer's liking and lab ties; the dean is elected (mean liking, lab size).
  power:
    grades: # user-stated: very good -> 100 % credit, good -> 80 %, "and so on"
      - { name: very_good, min_score: 0.5, credit_factor: 1.0 }
      - { name: good, min_score: 0.0, credit_factor: 0.8 }
      - { name: fair, min_score: -0.5, credit_factor: 0.6 }
      - { name: poor, min_score: -1.0e9, credit_factor: 0.4 }
    affinity_sigma: 0.5
    w_performance: 1.0
    w_affinity: 0.5
    w_lab: 0.3
    w_favor: 0.5
    noise: 0.3
    favor_decay: 0.2
    favor_per_committee: 0.2
    favor_per_external: 1.0
    affinity_per_service: 0.1
    affinity_per_refusal: 0.2
    appoint_w_rank: 0.5 # user-stated: seniority helps (Lektor Kepala, Profesor) above the minimum
    appoint_w_favor: 0.5
    appoint_w_affinity: 0.5
    appoint_w_lab: 0.3
    appoint_noise: 0.3

